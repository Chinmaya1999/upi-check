<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Paisa Admin</title>
<style>
  :root {
    --bg:#f5f6f8; --card:#fff; --ink:#15181e; --muted:#667085; --line:#e4e7ec; --brand:#5b3df5; --brand-ink:#fff;
    --ok:#067647; --ok-bg:#dcfae6; --warn:#b54708; --warn-bg:#fef0c7; --bad:#b42318; --bad-bg:#fee4e2; --hover:#f0f2f5;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1115; --card:#181b22; --ink:#eceef2; --muted:#9aa3b2; --line:#2a2f3a; --brand:#8b78ff; --brand-ink:#0f1115;
      --ok:#6ce9a6; --ok-bg:#073d28; --warn:#fec84b; --warn-bg:#47300a; --bad:#fda29b; --bad-bg:#4a1410; --hover:#1f232c; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  button,input,select,textarea { font:inherit; color:inherit; }
  header { display:flex; align-items:center; gap:16px; padding:0 20px; height:56px; background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  header h1 { font-size:16px; margin:0; display:flex; align-items:center; gap:8px; }
  .logo { width:26px; height:26px; border-radius:7px; background:var(--brand); color:var(--brand-ink); display:grid; place-items:center; font-weight:700; }
  nav { display:flex; gap:2px; overflow-x:auto; flex:1; }
  nav button { background:none; border:0; padding:8px 12px; border-radius:8px; cursor:pointer; color:var(--muted); white-space:nowrap; }
  nav button:hover { background:var(--hover); }
  nav button.on { background:var(--hover); color:var(--ink); font-weight:600; }
  main { max-width:1200px; margin:0 auto; padding:20px; }
  .grid { display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .card h3 { margin:0 0 10px; font-size:13px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  .stat .v { font-size:26px; font-weight:700; font-variant-numeric:tabular-nums; }
  .stat .s { color:var(--muted); font-size:12px; margin-top:2px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
  .row .grow { flex:1; }
  .cols { display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); margin-top:14px; }
  input[type=text],input[type=search],input[type=password],input[type=date],select,textarea {
    background:var(--card); border:1px solid var(--line); border-radius:8px; padding:8px 10px; min-width:0; }
  textarea { width:100%; resize:vertical; }
  input:focus,select:focus,textarea:focus,button:focus-visible { outline:2px solid var(--brand); outline-offset:1px; }
  .btn { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:7px 12px; cursor:pointer; }
  .btn:hover { background:var(--hover); }
  .btn.primary { background:var(--brand); color:var(--brand-ink); border-color:var(--brand); font-weight:600; }
  .btn.danger { color:var(--bad); border-color:var(--bad); }
  .btn.sm { padding:4px 9px; font-size:12px; }
  .btn:disabled { opacity:.5; cursor:default; }
  table { width:100%; border-collapse:collapse; }
  th,td { text-align:left; padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { font-size:12px; color:var(--muted); font-weight:600; white-space:nowrap; }
  tbody tr:hover { background:var(--hover); }
  tr.click { cursor:pointer; }
  td.num,th.num { text-align:right; font-variant-numeric:tabular-nums; }
  .tablewrap { overflow-x:auto; padding:0; }
  .pill { display:inline-block; padding:1px 8px; border-radius:99px; font-size:12px; font-weight:600; }
  .pill.ok { background:var(--ok-bg); color:var(--ok); } .pill.warn { background:var(--warn-bg); color:var(--warn); } .pill.bad { background:var(--bad-bg); color:var(--bad); }
  .pill.gray { background:var(--hover); color:var(--muted); }
  .muted { color:var(--muted); } .mono { font-family:ui-monospace,Menlo,monospace; font-size:12px; }
  .pager { display:flex; gap:10px; align-items:center; justify-content:flex-end; padding:10px; color:var(--muted); }
  .bars { display:flex; align-items:flex-end; gap:4px; height:90px; }
  .bars div { flex:1; background:var(--brand); border-radius:3px 3px 0 0; min-height:2px; opacity:.85; position:relative; }
  .bars div:hover { opacity:1; }
  .barlabels { display:flex; gap:4px; font-size:10px; color:var(--muted); margin-top:4px; }
  .barlabels span { flex:1; text-align:center; overflow:hidden; }
  .hbar { display:grid; grid-template-columns:110px 1fr 90px; gap:8px; align-items:center; margin:6px 0; font-size:13px; }
  .hbar .t { background:var(--hover); border-radius:4px; height:10px; } .hbar .t i { display:block; height:100%; background:var(--brand); border-radius:4px; }
  .toggle { display:flex; justify-content:space-between; align-items:center; gap:14px; padding:12px 0; border-bottom:1px solid var(--line); }
  .toggle:last-child { border-bottom:0; }
  .toggle small { display:block; color:var(--muted); }
  .switch { position:relative; width:42px; height:24px; flex:none; }
  .switch input { opacity:0; width:0; height:0; }
  .switch span { position:absolute; inset:0; background:var(--line); border-radius:99px; cursor:pointer; transition:.15s; }
  .switch span::after { content:""; position:absolute; width:18px; height:18px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.15s; }
  .switch input:checked + span { background:var(--brand); } .switch input:checked + span::after { transform:translateX(18px); }
  .switch input:focus-visible + span { outline:2px solid var(--brand); outline-offset:2px; }
  .field { margin:12px 0; } .field label { display:block; font-weight:600; margin-bottom:4px; }
  .field small { color:var(--muted); display:block; margin-top:3px; }
  #toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:10px; z-index:30; display:none; max-width:90vw; }
  #toast.err { background:var(--bad); color:#fff; }
  dialog { border:1px solid var(--line); border-radius:14px; background:var(--card); color:var(--ink); padding:0; width:min(760px,94vw); max-height:90vh; }
  dialog::backdrop { background:rgba(0,0,0,.45); }
  .dlg { padding:20px; overflow:auto; max-height:88vh; }
  .dlg h2 { margin:0 0 4px; font-size:18px; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; margin:14px 0; }
  .kv { display:grid; grid-template-columns:130px 1fr; gap:4px 12px; margin:12px 0; } .kv dt { color:var(--muted); } .kv dd { margin:0; word-break:break-all; }
  #login { max-width:340px; margin:14vh auto; } #login h2 { margin-top:0; }
  .empty { padding:30px; text-align:center; color:var(--muted); }
  .secret { background:var(--warn-bg); color:var(--warn); border-radius:8px; padding:10px; margin:10px 0; }
  @media (max-width:640px) { main { padding:12px; } header { padding:0 10px; gap:8px; } .hbar { grid-template-columns:80px 1fr 70px; } }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status"></div>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>

<script nonce="__NONCE__">
'use strict';
// ───────── tiny DOM helpers: all dynamic text goes through textContent, never innerHTML ─────────
const h = (tag, attrs, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'value' || k === 'checked' || k === 'disabled') e[k] = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c)));
  return e;
};
const $ = (s) => document.querySelector(s);
const inr = (paise) => '₹' + (Number(paise || 0) / 100).toLocaleString('en-IN', { maximumFractionDigits: 2 });
const num = (n) => Number(n || 0).toLocaleString('en-IN');
const when = (iso) => iso ? new Date(typeof iso === 'number' ? iso : iso).toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' }) : '—';
const ago = (iso) => {
  if (!iso) return 'never';
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 60) return 'just now'; if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago'; return Math.floor(s / 86400) + 'd ago';
};
const dur = (s) => { const d = Math.floor(s / 86400), hh = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60); return d ? `${d}d ${hh}h` : hh ? `${hh}h ${m}m` : `${m}m`; };
const bytes = (b) => b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : (b / 1024).toFixed(0) + ' KB';
const pill = (t, kind) => h('span', { class: 'pill ' + (kind || 'gray') }, t);

let toastTimer;
function toast(msg, isErr) {
  const t = $('#toast'); t.textContent = msg; t.className = isErr ? 'err' : ''; t.style.display = 'block';
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.style.display = 'none'), isErr ? 5000 : 2500);
}

async function api(method, path, body) {
  const r = await fetch('/admin/api' + path, {
    method, credentials: 'same-origin',
    headers: { 'X-Admin': '1', ...(body !== undefined ? { 'Content-Type': 'application/json' } : {}) },
    body: body !== undefined ? JSON.stringify(body) : undefined,
  });
  const data = await r.json().catch(() => ({}));
  if (r.status === 401 && path !== '/login') { showLogin(); throw new Error('Signed out'); }
  if (!r.ok) throw new Error(data.error || 'Request failed (' + r.status + ')');
  return data;
}
const act = async (fn, okMsg) => { try { const r = await fn(); if (okMsg) toast(okMsg); return r; } catch (e) { toast(e.message, true); } };
const qs = (o) => { const p = new URLSearchParams(); for (const [k, v] of Object.entries(o)) if (v !== '' && v != null) p.set(k, v); return p.toString(); };
const debounce = (fn, ms = 300) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

function confirmDlg(title, text, label, danger) {
  return new Promise((resolve) => {
    const d = $('#dlg'), b = $('#dlgBody');
    const done = (v) => { d.close(); resolve(v); };
    b.replaceChildren(h('h2', {}, title), h('p', { class: 'muted' }, text),
      h('div', { class: 'actions' }, h('button', { class: 'btn ' + (danger ? 'danger' : 'primary'), onclick: () => done(true) }, label), h('button', { class: 'btn', onclick: () => done(false) }, 'Cancel')));
    d.addEventListener('close', () => resolve(false), { once: true });
    d.showModal();
  });
}
const openDlg = (...nodes) => { $('#dlgBody').replaceChildren(...nodes); const d = $('#dlg'); if (!d.open) d.showModal(); };

// ───────── login ─────────
function showLogin() {
  $('#app').replaceChildren(h('form', { id: 'login', class: 'card', onsubmit: async (e) => {
    e.preventDefault();
    const pw = e.target.pw.value;
    await act(async () => { await api('POST', '/login', { password: pw }); boot(); });
  } },
    h('h2', {}, 'Paisa Admin'), h('p', { class: 'muted' }, 'Sign in to manage users, data and app settings.'),
    h('div', { class: 'field' }, h('label', { for: 'pw' }, 'Admin password'), h('input', { type: 'password', id: 'pw', name: 'pw', autocomplete: 'current-password', required: true, style: 'width:100%', autofocus: true })),
    h('button', { class: 'btn primary', style: 'width:100%' }, 'Sign in')));
}

// ───────── shell ─────────
const TABS = [['overview', 'Overview'], ['users', 'Users'], ['transactions', 'Transactions'], ['sessions', 'Sessions'], ['controls', 'App controls'], ['audit', 'Audit log']];
const VIEWS = { overview: viewOverview, users: viewUsers, transactions: viewTransactions, sessions: viewSessions, controls: viewControls, audit: viewAudit };
let tab = 'overview';

function boot() {
  const nav = h('nav', {}, TABS.map(([k, label]) => h('button', { 'data-tab': k, class: k === tab ? 'on' : '', onclick: () => go(k) }, label)));
  $('#app').replaceChildren(
    h('header', {}, h('h1', {}, h('span', { class: 'logo' }, '₹'), 'Paisa Admin'), nav,
      h('button', { class: 'btn sm', onclick: async () => { await act(() => api('POST', '/logout')); showLogin(); } }, 'Sign out')),
    h('main', { id: 'main' }));
  go((location.hash || '').slice(1) in VIEWS ? location.hash.slice(1) : tab);
}
function go(k) {
  tab = k; location.hash = k;
  document.querySelectorAll('nav button').forEach((b) => b.classList.toggle('on', b.dataset.tab === k));
  const main = $('#main'); main.replaceChildren(h('div', { class: 'empty' }, 'Loading…'));
  VIEWS[k](main).catch((e) => { if (e.message !== 'Signed out') main.replaceChildren(h('div', { class: 'empty' }, e.message)); });
}

const statCard = (label, value, sub) => h('div', { class: 'card stat' }, h('h3', {}, label), h('div', { class: 'v' }, value), sub ? h('div', { class: 's' }, sub) : null);

function barChart(series) {
  const max = Math.max(1, ...series.map((s) => s.count));
  return h('div', {},
    h('div', { class: 'bars' }, series.map((s) => h('div', { style: `height:${Math.max(2, s.count / max * 100)}%`, title: `${s.day}: ${s.count}` }))),
    h('div', { class: 'barlabels' }, series.map((s, i) => h('span', {}, i % 2 === 0 ? s.day.slice(8) : ''))));
}
function hbars(rows, fmtRight) {
  if (!rows.length) return h('div', { class: 'muted' }, 'No data yet');
  const max = Math.max(1, ...rows.map((r) => r.paise));
  return h('div', {}, rows.map((r) => h('div', { class: 'hbar' }, h('span', {}, r.key), h('div', { class: 't' }, h('i', { style: `width:${r.paise / max * 100}%` })), h('span', { class: 'num', style: 'text-align:right' }, fmtRight(r)))));
}

// ───────── overview ─────────
async function viewOverview(main) {
  const s = await api('GET', '/stats');
  const cfgFlags = [];
  if (s.config.maintenanceMode) cfgFlags.push(pill('Maintenance ON', 'bad'));
  if (!s.config.registrationsOpen) cfgFlags.push(pill('Sign-ups paused', 'warn'));
  if (!s.config.syncEnabled) cfgFlags.push(pill('Sync disabled', 'warn'));
  main.replaceChildren(
    h('div', { class: 'row' }, h('h2', { style: 'margin:0' }, 'Overview'), cfgFlags, h('span', { class: 'grow' }), h('button', { class: 'btn sm', onclick: () => go('overview') }, 'Refresh')),
    h('div', { class: 'grid' },
      statCard('Users', num(s.users.total), `${num(s.users.active)} active · ${num(s.users.suspended)} suspended`),
      statCard('New users', num(s.users.last7d), `last 7 days · ${num(s.users.last30d)} in 30 days`),
      statCard('Signed-in devices', num(s.activeSessions), 'active sessions'),
      statCard('Transactions', num(s.transactions.total), `${num(s.transactions.needsReview)} need review`),
      statCard('Total spent', inr(s.transactions.debitPaise), 'confirmed debits, all users'),
      statCard('Total received', inr(s.transactions.creditPaise), 'confirmed credits, all users')),
    h('div', { class: 'cols' },
      h('div', { class: 'card' }, h('h3', {}, 'Sign-ups · last 14 days'), barChart(s.signups)),
      h('div', { class: 'card' }, h('h3', {}, 'Transactions by day · last 14 days'), barChart(s.transactionsPerDay)),
      h('div', { class: 'card' }, h('h3', {}, 'Spend by payment app'), hbars(s.byApp, (r) => inr(r.paise))),
      h('div', { class: 'card' }, h('h3', {}, 'Spend by category'), hbars(s.byCategory, (r) => inr(r.paise))),
      h('div', { class: 'card' }, h('h3', {}, 'Server'),
        h('dl', { class: 'kv' }, h('dt', {}, 'Uptime'), h('dd', {}, dur(s.server.uptimeSec)), h('dt', {}, 'Database'), h('dd', {}, bytes(s.server.dbBytes)),
          h('dt', {}, 'Memory'), h('dd', {}, s.server.memoryMb + ' MB'), h('dt', {}, 'Node'), h('dd', {}, s.server.node)))));
}

// ───────── users ─────────
async function viewUsers(main) {
  const st = { search: '', status: '', offset: 0, limit: 25 };
  const list = h('div', { class: 'card tablewrap' });
  const load = async () => {
    const r = await api('GET', '/users?' + qs(st));
    list.replaceChildren(r.users.length ? h('table', {},
      h('thead', {}, h('tr', {}, ['Name', 'Contact', 'Status', 'Joined', 'Last login', 'Last sync', 'Txns', 'Devices'].map((c, i) => h('th', { class: i > 5 ? 'num' : '' }, c)))),
      h('tbody', {}, r.users.map((u) => h('tr', { class: 'click', onclick: () => userDialog(u.id, load) },
        h('td', {}, u.name), h('td', { class: 'mono' }, u.contact), h('td', {}, pill(u.status, u.status === 'active' ? 'ok' : 'bad')),
        h('td', {}, when(u.created_at)), h('td', {}, ago(u.last_login_at)), h('td', {}, u.last_sync ? ago(u.last_sync) : 'never'),
        h('td', { class: 'num' }, num(u.txn_count)), h('td', { class: 'num' }, num(u.sessions)))))) : h('div', { class: 'empty' }, 'No users match'),
      pager(st, r.total, load));
  };
  main.replaceChildren(
    h('div', { class: 'row' }, h('h2', { style: 'margin:0' }, 'Users'), h('span', { class: 'grow' }),
      h('input', { type: 'search', placeholder: 'Search name, contact or ID', style: 'min-width:240px', oninput: debounce((e) => { st.search = e.target.value; st.offset = 0; load(); }) }),
      h('select', { onchange: (e) => { st.status = e.target.value; st.offset = 0; load(); }, 'aria-label': 'Status' },
        h('option', { value: '' }, 'All'), h('option', { value: 'active' }, 'Active'), h('option', { value: 'suspended' }, 'Suspended')),
      h('a', { class: 'btn', href: '/admin/api/users.csv', download: '' }, 'Export CSV')),
    list);
  await load();
}

function pager(st, total, load) {
  const end = Math.min(st.offset + st.limit, total);
  return h('div', { class: 'pager' }, total ? `${st.offset + 1}–${end} of ${num(total)}` : '0 results',
    h('button', { class: 'btn sm', disabled: st.offset === 0, onclick: () => { st.offset = Math.max(0, st.offset - st.limit); load(); } }, 'Prev'),
    h('button', { class: 'btn sm', disabled: end >= total, onclick: () => { st.offset += st.limit; load(); } }, 'Next'));
}

async function userDialog(id, refresh) {
  let d;
  try { d = await api('GET', '/users/' + id); } catch (e) { return toast(e.message, true); }
  const u = d.user;
  const reload = async () => { await userDialog(id, refresh); refresh && refresh(); };
  const run = (fn, ok) => async () => { if (await act(fn, ok) !== undefined) await reload(); };
  const secret = h('div');
  openDlg(
    h('h2', {}, u.name), h('div', {}, pill(u.status, u.status === 'active' ? 'ok' : 'bad'), ' ', h('span', { class: 'muted mono' }, u.id)),
    h('dl', { class: 'kv' },
      h('dt', {}, 'Contact'), h('dd', {}, u.contact), h('dt', {}, 'Joined'), h('dd', {}, when(u.created_at)), h('dt', {}, 'Last login'), h('dd', {}, when(u.last_login_at)),
      h('dt', {}, 'Transactions'), h('dd', {}, `${num(d.totals.count)} (${d.totals.firstDay || '—'} → ${d.totals.lastDay || '—'})`),
      h('dt', {}, 'Spent / received'), h('dd', {}, `${inr(d.totals.debitPaise)} / ${inr(d.totals.creditPaise)}`),
      h('dt', {}, 'Signed-in devices'), h('dd', {}, d.sessions.length ? d.sessions.map((s) => h('div', {}, `since ${when(s.created_at || null)} · expires ${when(s.expires_at)} `, h('button', { class: 'btn sm', onclick: run(() => api('DELETE', '/sessions/' + s.id), 'Device signed out') }, 'Sign out'))) : 'None')),
    h('div', { class: 'actions' },
      h('button', { class: 'btn', onclick: () => editUser(u, reload) }, 'Edit details'),
      u.status === 'active'
        ? h('button', { class: 'btn', onclick: async () => { if (await confirmDlg('Suspend ' + u.name + '?', 'They are signed out everywhere and cannot log in until you unsuspend them.', 'Suspend', true)) await run(() => api('POST', `/users/${id}/suspend`), 'User suspended')(); else userDialog(id, refresh); } }, 'Suspend')
        : h('button', { class: 'btn primary', onclick: run(() => api('POST', `/users/${id}/unsuspend`), 'User reactivated') }, 'Reactivate'),
      h('button', { class: 'btn', onclick: run(() => api('POST', `/users/${id}/logout`), 'Signed out of all devices') }, 'Sign out everywhere'),
      h('button', { class: 'btn', onclick: async () => {
        const r = await act(() => api('POST', `/users/${id}/reset-password`, {}), 'Password reset');
        if (r) secret.replaceChildren(h('div', { class: 'secret' }, 'New temporary password (shown once): ', h('strong', { class: 'mono' }, r.password)));
      } }, 'Reset password')),
    secret,
    h('h3', {}, 'Recent transactions'), txnTable(d.recentTransactions, false, () => reload()),
    h('div', { class: 'actions', style: 'margin-top:20px' },
      h('button', { class: 'btn danger', onclick: async () => { if (await confirmDlg('Delete all transactions?', `Permanently removes ${num(d.totals.count)} synced transactions for ${u.name}. Their device copy is untouched and will re-sync.`, 'Delete transactions', true)) { await act(() => api('DELETE', `/users/${id}/transactions`), 'Transactions deleted'); } userDialog(id, refresh); refresh && refresh(); } }, 'Clear synced data'),
      h('button', { class: 'btn danger', onclick: async () => { if (await confirmDlg('Delete ' + u.name + '?', 'Permanently deletes the account, sessions and all synced data. This cannot be undone.', 'Delete account', true)) { if (await act(() => api('DELETE', '/users/' + id), 'Account deleted') !== undefined) { $('#dlg').close(); refresh && refresh(); } } else userDialog(id, refresh); } }, 'Delete account'),
      h('button', { class: 'btn', style: 'margin-left:auto', onclick: () => $('#dlg').close() }, 'Close')));
}

function editUser(u, done) {
  openDlg(h('h2', {}, 'Edit user'), h('form', { onsubmit: async (e) => {
    e.preventDefault();
    const f = e.target;
    if (await act(() => api('PATCH', '/users/' + u.id, { name: f.name.value, contact: f.contact.value }), 'Saved') !== undefined) done();
  } },
    h('div', { class: 'field' }, h('label', {}, 'Name'), h('input', { type: 'text', name: 'name', value: u.name, required: true, style: 'width:100%' })),
    h('div', { class: 'field' }, h('label', {}, 'Mobile or email'), h('input', { type: 'text', name: 'contact', value: u.contact, required: true, style: 'width:100%' })),
    h('div', { class: 'actions' }, h('button', { class: 'btn primary' }, 'Save'), h('button', { type: 'button', class: 'btn', onclick: done }, 'Cancel'))));
}

// ───────── transactions ─────────
function txnTable(rows, showUser, after) {
  if (!rows.length) return h('div', { class: 'empty' }, 'No transactions');
  return h('div', { class: 'tablewrap' }, h('table', {},
    h('thead', {}, h('tr', {}, ['Date', showUser ? 'User' : null, 'Merchant', 'Category', 'App', 'Status', 'Amount', ''].map((c, i) => c === null ? null : h('th', { class: i === 6 ? 'num' : '' }, c)))),
    h('tbody', {}, rows.map((t) => h('tr', {},
      h('td', {}, t.dayKey || '—'),
      showUser ? h('td', {}, h('a', { href: '#', onclick: (e) => { e.preventDefault(); userDialog(t.userId); } }, t.userName || t.userContact)) : null,
      h('td', {}, t.merchant || '—', t.needsReview ? [' ', pill('review', 'warn')] : null),
      h('td', {}, t.categoryId), h('td', {}, t.paymentApp),
      h('td', {}, pill(t.status + (t.kind && t.kind !== 'normal' ? ' · ' + t.kind : ''), t.status === 'confirmed' ? 'ok' : t.status === 'failed' ? 'bad' : 'gray')),
      h('td', { class: 'num', style: t.direction === 'credit' ? 'color:var(--ok)' : '' }, (t.direction === 'credit' ? '+' : '−') + inr(t.amountPaise)),
      h('td', {}, h('button', { class: 'btn sm danger', onclick: async () => {
        if (!(await confirmDlg('Delete this transaction?', `${t.merchant || 'Transaction'} · ${inr(t.amountPaise)} on ${t.dayKey}`, 'Delete', true))) return;
        await act(() => api('DELETE', `/transactions/${t.userId}/${encodeURIComponent(t.id)}`), 'Deleted'); after && after();
      } }, 'Delete')))))));
}

async function viewTransactions(main) {
  const st = { search: '', direction: '', status: '', review: '', from: '', to: '', offset: 0, limit: 25 };
  const out = h('div', { class: 'card', style: 'padding:0' });
  const load = async () => {
    const r = await api('GET', '/transactions?' + qs(st));
    out.replaceChildren(txnTable(r.transactions, true, load), pager(st, r.total, load));
  };
  const sel = (key, opts) => h('select', { 'aria-label': key, onchange: (e) => { st[key] = e.target.value; st.offset = 0; load(); } }, opts.map(([v, l]) => h('option', { value: v }, l)));
  main.replaceChildren(
    h('div', { class: 'row' }, h('h2', { style: 'margin:0' }, 'Transactions'), h('span', { class: 'grow' }),
      h('input', { type: 'search', placeholder: 'Merchant or reference', oninput: debounce((e) => { st.search = e.target.value; st.offset = 0; load(); }) }),
      sel('direction', [['', 'Any direction'], ['debit', 'Debits'], ['credit', 'Credits']]),
      sel('status', [['', 'Any status'], ['confirmed', 'Confirmed'], ['pending', 'Pending'], ['failed', 'Failed'], ['reversed', 'Reversed']]),
      sel('review', [['', 'All'], ['1', 'Needs review']]),
      h('input', { type: 'date', 'aria-label': 'From', onchange: (e) => { st.from = e.target.value; st.offset = 0; load(); } }),
      h('input', { type: 'date', 'aria-label': 'To', onchange: (e) => { st.to = e.target.value; st.offset = 0; load(); } })),
    out);
  await load();
}

// ───────── sessions ─────────
async function viewSessions(main) {
  const r = await api('GET', '/sessions');
  main.replaceChildren(h('div', { class: 'row' }, h('h2', { style: 'margin:0' }, 'Signed-in devices'), h('span', { class: 'muted' }, num(r.sessions.length) + ' active')),
    h('div', { class: 'card tablewrap' }, r.sessions.length ? h('table', {},
      h('thead', {}, h('tr', {}, ['User', 'Contact', 'Signed in', 'Expires', ''].map((c) => h('th', {}, c)))),
      h('tbody', {}, r.sessions.map((s) => h('tr', {},
        h('td', {}, h('a', { href: '#', onclick: (e) => { e.preventDefault(); userDialog(s.user_id, () => go('sessions')); } }, s.name)), h('td', { class: 'mono' }, s.contact),
        h('td', {}, s.created_at ? when(s.created_at) : 'before tracking'), h('td', {}, when(s.expires_at)),
        h('td', {}, h('button', { class: 'btn sm danger', onclick: async () => { await act(() => api('DELETE', '/sessions/' + s.id), 'Signed out'); go('sessions'); } }, 'Sign out')))))) : h('div', { class: 'empty' }, 'No active sessions')));
}

// ───────── app controls ─────────
async function viewControls(main) {
  const { config: c } = await api('GET', '/config');
  const save = async (patch, msg) => { const r = await act(() => api('PUT', '/config', patch), msg || 'Saved'); if (r) go('controls'); };
  const toggle = (key, title, sub, danger) => h('div', { class: 'toggle' }, h('div', {}, h('strong', {}, title), h('small', {}, sub)),
    h('label', { class: 'switch' }, h('input', { type: 'checkbox', checked: !!c[key], 'aria-label': title, onchange: async (e) => {
      if (danger && e.target.checked && !(await confirmDlg(title + '?', sub, 'Turn on', true))) { e.target.checked = false; return; }
      save({ [key]: e.target.checked });
    } }), h('span')));
  const text = (key, title, sub, area) => {
    const input = area ? h('textarea', { rows: 3, maxlength: 500 }, c[key]) : h('input', { type: 'text', value: c[key], maxlength: 500, style: 'width:100%' });
    return h('div', { class: 'field' }, h('label', {}, title), input, h('small', {}, sub), h('button', { class: 'btn sm primary', style: 'margin-top:8px', onclick: () => save({ [key]: input.value }) }, 'Save'));
  };
  main.replaceChildren(h('h2', { style: 'margin-top:0' }, 'App controls'), h('p', { class: 'muted' }, 'These apply to the live app immediately.'),
    h('div', { class: 'cols', style: 'margin-top:0' },
      h('div', { class: 'card' }, h('h3', {}, 'Feature switches'),
        toggle('registrationsOpen', 'Allow new sign-ups', 'Turn off to stop new accounts being created.'),
        toggle('syncEnabled', 'Cloud sync', 'Turn off to pause transaction uploads from all devices.'),
        toggle('maintenanceMode', 'Maintenance mode', 'Blocks login, sign-up and sync for every user (503) until turned off.', true)),
      h('div', { class: 'card' }, h('h3', {}, 'Messages'),
        text('maintenanceMessage', 'Maintenance message', 'Shown to users while maintenance mode is on.', true),
        text('announcement', 'Announcement', 'Served to the app at GET /config. Leave empty for none.', true),
        text('minAppVersion', 'Minimum app version', 'e.g. 0.1.20 — served to the app at GET /config.'))));
}

// ───────── audit ─────────
async function viewAudit(main) {
  const st = { offset: 0, limit: 50 };
  const box = h('div', { class: 'card tablewrap' });
  const load = async () => {
    const r = await api('GET', '/audit?' + qs(st));
    box.replaceChildren(r.entries.length ? h('table', {},
      h('thead', {}, h('tr', {}, ['When', 'Action', 'Target', 'Details', 'IP'].map((c) => h('th', {}, c)))),
      h('tbody', {}, r.entries.map((e) => h('tr', {}, h('td', {}, when(e.at)), h('td', {}, pill(e.action, e.action.includes('delete') || e.action.includes('failed') ? 'bad' : 'gray')),
        h('td', { class: 'mono' }, e.target || '—'), h('td', { class: 'mono', style: 'max-width:380px;word-break:break-all' }, e.detail || ''), h('td', { class: 'mono' }, e.ip || ''))))) : h('div', { class: 'empty' }, 'Nothing logged yet'),
      pager(st, r.total, load));
  };
  main.replaceChildren(h('div', { class: 'row' }, h('h2', { style: 'margin:0' }, 'Audit log'), h('span', { class: 'muted' }, 'Every admin action is recorded.')), box);
  await load();
}

window.addEventListener('hashchange', () => { const k = location.hash.slice(1); if (k in VIEWS && k !== tab && $('#main')) go(k); });
api('GET', '/session').then(boot).catch(() => showLogin());
</script>
</body>
