<style>

  .brand b { display:block; color:#fff; font-size:16px; letter-spacing:-.2px; } .brand small { color:var(--side-muted); font-size:11.5px; }

  /* festival previews */

  .fest .ftxt { position:relative; z-index:2; display:grid; gap:2px; text-shadow:0 1px 8px rgba(0,0,0,.25); } .fest .ftxt b { font-size:19px; letter-spacing:-.3px; } .fest .ftxt small { font-size:12.5px; opacity:.92; }

  .grow { flex:1; }

  .iconbtn:hover { background:var(--hover); } .menubtn { display:none; }

  /* ───── building blocks ───── */

  .hero { display:flex; align-items:center; gap:18px; flex-wrap:wrap; padding:22px 24px; border-radius:18px; color:#fff; margin-bottom:16px; position:relative; overflow:hidden;
    background:linear-gradient(120deg,#2b1d7a 0%,#6c4cf5 52%,#c084fc 100%); box-shadow:0 14px 34px rgba(108,76,245,.32); }
  .hero::after { content:""; position:absolute; right:-60px; top:-70px; width:240px; height:240px; border-radius:50%; background:rgba(255,255,255,.12); }
  .hero h2 { display:block !important; margin:0; font-size:22px; letter-spacing:-.4px; } .hero p { margin:3px 0 0; opacity:.85; } .hero .btn { background:rgba(255,255,255,.16); border-color:rgba(255,255,255,.3); color:#fff; backdrop-filter:blur(4px); }
  .hero .btn:hover { background:rgba(255,255,255,.26); } .hero .tags { display:flex; gap:8px; flex-wrap:wrap; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:16px; } .row .grow { flex:1; }
  input[type=text],input[type=search],input[type=password],input[type=date],select,textarea { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:9px 12px; min-width:0; }

  .btn { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 14px; cursor:pointer; text-decoration:none; color:var(--ink); display:inline-flex; align-items:center; gap:7px; transition:background .12s, transform .08s; }
  .btn:hover { background:var(--hover); } .btn:active { transform:translateY(1px); }
  .btn.primary { background:linear-gradient(135deg,var(--brand),var(--brand2)); color:#fff; border-color:transparent; font-weight:600; box-shadow:0 6px 16px rgba(108,76,245,.3); } .btn.primary:hover { filter:brightness(1.06); }
  .btn.danger { color:var(--bad); border-color:color-mix(in srgb, var(--bad) 50%, transparent); } .btn.sm { padding:4px 10px; font-size:12px; border-radius:8px; } .btn:disabled { opacity:.5; cursor:default; }
  table { width:100%; border-collapse:collapse; }
  th,td { text-align:left; padding:12px 14px; border-bottom:1px solid var(--line); vertical-align:middle; }

  tbody tr { transition:background .1s; } tbody tr:hover { background:var(--hover); } tbody tr:last-child td { border-bottom:0; }
  tr.click { cursor:pointer; } td.num,th.num { text-align:right; font-variant-numeric:tabular-nums; }
  .tablewrap { overflow-x:auto; padding:0; border-radius:16px; }

  .pill.ok { background:var(--ok-bg); color:var(--ok); } .pill.warn { background:var(--warn-bg); color:var(--warn); } .pill.bad { background:var(--bad-bg); color:var(--bad); } .pill.gray { background:var(--hover); color:var(--muted); } .pill.brand { background:var(--brand-soft); color:var(--brand); }
  .avatar { width:34px; height:34px; border-radius:50%; display:inline-grid; place-items:center; font-weight:700; font-size:13px; color:#fff; flex:none; }
  .who { display:flex; align-items:center; gap:10px; } .who b { display:block; line-height:1.2; } .who small { color:var(--muted); }
  .muted { color:var(--muted); } .mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; }
  .pager { display:flex; gap:10px; align-items:center; justify-content:flex-end; padding:12px 14px; color:var(--muted); border-top:1px solid var(--line); }
  .bars { display:flex; align-items:flex-end; gap:5px; height:110px; } .bars div { flex:1; background:linear-gradient(var(--brand2),var(--brand)); border-radius:5px 5px 0 0; min-height:3px; opacity:.88; } .bars div:hover { opacity:1; }

  .hbar .t { background:var(--hover); border-radius:99px; height:9px; overflow:hidden; } .hbar .t i { display:block; height:100%; background:linear-gradient(90deg,var(--brand),var(--brand2)); border-radius:99px; transition:width .6s cubic-bezier(.2,.7,.2,1); }
  .donut { display:flex; align-items:center; gap:18px; flex-wrap:wrap; } .legend { flex:1; min-width:140px; } .legend div { display:flex; align-items:center; gap:8px; margin:6px 0; font-size:13px; } .legend i { width:10px; height:10px; border-radius:3px; flex:none; } .legend span:last-child { margin-left:auto; font-weight:600; font-variant-numeric:tabular-nums; }
  .feed { list-style:none; margin:0; padding:0; } .feed li { display:flex; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); align-items:center; } .feed li:last-child { border-bottom:0; } .feed .meta { flex:1; min-width:0; } .feed .meta b { display:block; font-weight:600; } .feed .meta small { color:var(--muted); }

  .switch span { position:absolute; inset:0; background:var(--line); border-radius:99px; cursor:pointer; transition:.18s; } .switch span::after { content:""; position:absolute; width:19px; height:19px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.18s; box-shadow:0 1px 3px rgba(0,0,0,.3); }
  .switch input:checked + span { background:linear-gradient(135deg,var(--brand),var(--brand2)); } .switch input:checked + span::after { transform:translateX(19px); } .switch input:focus-visible + span { outline:2px solid var(--brand); outline-offset:2px; }
  .field { margin:14px 0; } .field label { display:block; font-weight:600; margin-bottom:5px; } .field small { color:var(--muted); display:block; margin-top:4px; }
  #toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:11px 18px; border-radius:12px; z-index:90; display:none; max-width:90vw; box-shadow:0 12px 30px rgba(0,0,0,.3); font-weight:500; } #toast.err { background:var(--bad); color:#fff; }

function phonePreview(d, dark) {
  const sf = dark ? d.dark : d.light;
  const brand = dark ? d.brand : (d.brandLight || d.brand);
  const lum = (hex) => { const n = parseInt(hex.slice(1), 16); const f = (c) => { c /= 255; return c <= .03928 ? c / 12.92 : Math.pow((c + .055) / 1.055, 2.4); }; return .2126 * f(n >> 16 & 255) + .7152 * f(n >> 8 & 255) + .0722 * f(n & 255); };
  const on = (hex) => (lum(hex) > .4 ? '#0B0F14' : '#FFFFFF');
  const k = .55;                                        // preview scale for corner sizes
  const dens = d.density === 'compact' ? .72 : d.density === 'roomy' ? 1.25 : 1;
  const gap = Math.round(6 * dens) + 'px';
  const st = (el, o) => { Object.assign(el.style, o); return el; };
  const div = (style, ...kids) => st(h('div', {}, ...kids), style);
  const brutal = d.cardStyle === 'brutal';

async function viewDesign(main) {
  const r = await api('GET', '/designs');

  const card = (d) => {
    const on = d.id === r.active;
