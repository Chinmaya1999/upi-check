name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      abis:
        description: "Android ABIs to build (more = slower). Default covers all modern phones and Apple-silicon emulators."
        default: arm64-v8a
        type: choice
        options: [arm64-v8a, "arm64-v8a,armeabi-v7a", "arm64-v8a,armeabi-v7a,x86_64"]

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}   # never cancel a deploy half-way

env:
  SERVER_HOST: 13.201.66.53
  SERVER_USER: ec2-user
  API_URL: https://api.paisaduniya.in
  ADMIN_URL: https://paisaduniya.in
  IMAGE: awsmallick1999/paisa-api

jobs:
  # ── 0. What changed? Backend-only pushes skip the 10-minute APK build, app-only pushes skip the deploy ──
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.f.outputs.api }}
      app: ${{ steps.f.outputs.app }}
    steps:
      - uses: actions/checkout@v4
      - id: f
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'backend/**'
              - 'packages/core/**'
              - 'Dockerfile'
              - 'infra/**'
              - 'scripts/**'
              - 'package*.json'
              - '.github/workflows/**'
            app:
              - 'mobile/**'
              - 'packages/core/**'
              - '.github/workflows/**'

  # ── 1. Quality gate: engine tests + typecheck for core, backend and the app ─────────────────────
  test:
    name: Test & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - name: Install (root workspaces)
        run: npm ci
      - name: Engine tests
        run: npm test
      - name: Typecheck core + backend
        run: npm run typecheck -w @upi/core -w @upi/backend
      - name: Build backend bundle
        run: npm run build -w backend
      - name: Backend API tests (sign-up OTP, login, profile, feedback, admin, festivals)
        run: npm test -w backend
      - name: Install + typecheck mobile app
        working-directory: mobile
        run: |
          npm ci
          npx tsc --noEmit
      - name: Shell script syntax
        run: bash -n infra/deploy.sh && bash -n infra/backup-db.sh && bash -n scripts/smoke-test.sh

  # ── 2. Build + push the API image (main only) ───────────────────────────────────────────────────
  image:
    name: Build & push API image
    needs: [test, changes]
    if: github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.api == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check required secrets
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          missing=""
          [ -z "$DH_USER" ] && missing="$missing DOCKERHUB_USERNAME"
          [ -z "$DH_TOKEN" ] && missing="$missing DOCKERHUB_TOKEN"
          [ -z "$SSH_KEY" ] && missing="$missing EC2_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error title=Missing repository secrets::Add these under Settings > Secrets and variables > Actions:$missing"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3. Deploy to EC2 over SSH, health-check, auto-rollback, then smoke-test the public URL ─────
  deploy:
    name: Deploy to server
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          # Secrets pasted into the web form often lose their line breaks (or gain CRs). Rebuild a clean PEM from the body.
          python3 - <<'PY'
          import os, re, sys, textwrap
          k = os.environ["EC2_SSH_KEY"].replace("\r", "")
          m = re.search(r"-----BEGIN ([A-Z ]+)-----(.*?)-----END \1-----", k, re.S)
          if not m:
              sys.exit("::error title=EC2_SSH_KEY is not a PEM private key::Re-set it with: gh secret set EC2_SSH_KEY < adihuman.pem")
          body = re.sub(r"\s+", "", m.group(2))
          pem = f"-----BEGIN {m.group(1)}-----\n" + "\n".join(textwrap.wrap(body, 64)) + f"\n-----END {m.group(1)}-----\n"
          open(os.path.expanduser("~/.ssh/deploy.pem"), "w").write(pem)
          PY
          chmod 600 ~/.ssh/deploy.pem
          ssh-keygen -y -f ~/.ssh/deploy.pem > /dev/null || { echo "::error title=EC2_SSH_KEY is corrupt::Re-set it with: gh secret set EC2_SSH_KEY < adihuman.pem"; exit 1; }
          ssh-keyscan -T 10 -H "$SERVER_HOST" >> ~/.ssh/known_hosts
      - name: Upload deploy files
        run: |
          scp -i ~/.ssh/deploy.pem infra/deploy.sh infra/backup-db.sh infra/docker-compose.yml infra/Caddyfile \
            "$SERVER_USER@$SERVER_HOST:~/paisa/"
      - name: Write admin dashboard password to server
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          # Lives only in ~/paisa/.env (mode 600), read by docker compose. Unset secret = dashboard stays disabled.
          if [ -z "$ADMIN_PASSWORD" ]; then echo "::warning title=ADMIN_PASSWORD secret not set::Admin dashboard will be disabled"; fi
          if [ -z "$SMTP_USER" ] || [ -z "$SMTP_PASS" ]; then echo "::warning title=SMTP secrets not set::Sign-up and password-reset emails cannot be sent"; fi
          printf 'ADMIN_PASSWORD=%s\nSMTP_USER=%s\nSMTP_PASS=%s\n' "$ADMIN_PASSWORD" "$SMTP_USER" "$SMTP_PASS" | ssh -i ~/.ssh/deploy.pem "$SERVER_USER@$SERVER_HOST" \
            "umask 077 && cat > ~/paisa/.env"
      - name: Deploy ${{ github.sha }}
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          TAG: ${{ env.IMAGE }}:${{ github.sha }}   # not a job output: the image name contains a secret value, which GitHub redacts from outputs
        run: |
          # Registry login happens on the server for the pull only; the credential is removed afterwards.
          printf '%s' "$DH_TOKEN" | ssh -i ~/.ssh/deploy.pem "$SERVER_USER@$SERVER_HOST" \
            "docker login -u '$DH_USER' --password-stdin >/dev/null && trap 'docker logout >/dev/null' EXIT && bash ~/paisa/deploy.sh '$TAG'"
      - name: Nightly DB backup cron
        run: |
          ssh -i ~/.ssh/deploy.pem "$SERVER_USER@$SERVER_HOST" \
            "(crontab -l 2>/dev/null | grep -v backup-db.sh; echo '0 21 * * * bash \$HOME/paisa/backup-db.sh >> \$HOME/paisa/backups/cron.log 2>&1') | crontab -"
      - name: Wait for HTTPS certificate
        run: |
          # First deploy on a new domain: Caddy needs a few seconds to obtain the Let's Encrypt certificate.
          for i in $(seq 1 30); do
            curl -fsS -m 10 "$API_URL/health" >/dev/null 2>&1 && { echo "HTTPS is up"; exit 0; }
            sleep 6
          done
          echo "::error title=HTTPS not reachable::$API_URL did not come up. Check DNS, security group port 443, and 'docker logs paisa-caddy'."; exit 1
      - name: Smoke test public API (${{ env.API_URL }})
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}   # lets the test create its throwaway verified account via the admin API
        run: bash scripts/smoke-test.sh "$API_URL" "$ADMIN_URL"
      - name: Show server state on failure
        if: failure()
        run: ssh -i ~/.ssh/deploy.pem "$SERVER_USER@$SERVER_HOST" 'docker ps -a; docker logs --tail 80 paisa-api 2>&1 || true; docker logs --tail 40 paisa-caddy 2>&1 || true'

  # ── 4. Build the Android APK against the live API (parallel to image/deploy) ────────────────────
  apk:
    name: Build Android APK
    needs: [test, changes]
    if: github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.app == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}   # main writes the cache, branches only read it
      - name: Install app dependencies
        working-directory: mobile
        run: npm ci
      - name: Build release APK
        working-directory: mobile/android
        env:
          EXPO_PUBLIC_API_URL: ${{ env.API_URL }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDirectRelease --no-daemon --console=plain \
            -PversionCode=$((3200 + ${{ github.run_number }})) -PversionName=0.6.${{ github.run_number }} \
            -PreactNativeArchitectures=${{ inputs.abis || 'arm64-v8a' }} \
            --build-cache --parallel
      - name: Name the artifact
        run: cp mobile/android/app/build/outputs/apk/direct/release/app-direct-release.apk Paisa-build-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Paisa-apk-${{ github.run_number }}
          path: Paisa-build-${{ github.run_number }}.apk
          retention-days: 30
