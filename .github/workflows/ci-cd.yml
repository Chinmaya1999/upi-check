name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}   # never cancel a deploy half-way

env:
  SERVER_HOST: 13.201.66.53
  SERVER_USER: ec2-user
  API_URL: http://13.201.66.53
  IMAGE: awsmallick1999/paisa-api

jobs:
  # ── 1. Quality gate: engine tests + typecheck for core, backend and the app ─────────────────────
  test:
    name: Test & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - name: Install (root workspaces)
        run: npm ci
      - name: Engine tests
        run: npm test
      - name: Typecheck core + backend
        run: npm run typecheck -w @upi/core -w @upi/backend
      - name: Build backend bundle
        run: npm run build -w backend
      - name: Install + typecheck mobile app
        working-directory: mobile
        run: |
          npm ci
          npx tsc --noEmit
      - name: Shell script syntax
        run: bash -n infra/deploy.sh && bash -n infra/backup-db.sh && bash -n scripts/smoke-test.sh

  # ── 2. Build + push the API image (main only) ───────────────────────────────────────────────────
  image:
    name: Build & push API image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Check required secrets
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          missing=""
          [ -z "$DH_USER" ] && missing="$missing DOCKERHUB_USERNAME"
          [ -z "$DH_TOKEN" ] && missing="$missing DOCKERHUB_TOKEN"
          [ -z "$SSH_KEY" ] && missing="$missing EC2_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error title=Missing repository secrets::Add these under Settings > Secrets and variables > Actions:$missing"
            exit 1
          fi
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=${IMAGE}:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 3. Deploy to EC2 over SSH, health-check, auto-rollback, then smoke-test the public URL ─────
  deploy:
    name: Deploy to server
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy.pem
          chmod 600 ~/.ssh/deploy.pem
          ssh-keyscan -T 10 -H "$SERVER_HOST" >> ~/.ssh/known_hosts
      - name: Upload deploy files
        run: |
          scp -i ~/.ssh/deploy.pem infra/deploy.sh infra/backup-db.sh infra/docker-compose.yml \
            "$SERVER_USER@$SERVER_HOST:~/paisa/"
      - name: Deploy ${{ needs.image.outputs.tag }}
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          TAG: ${{ needs.image.outputs.tag }}
        run: |
          # Registry login happens on the server for the pull only; the credential is removed afterwards.
          printf '%s' "$DH_TOKEN" | ssh -i ~/.ssh/deploy.pem "$SERVER_USER@$SERVER_HOST" \
            "docker login -u '$DH_USER' --password-stdin >/dev/null && trap 'docker logout >/dev/null' EXIT && bash ~/paisa/deploy.sh '$TAG'"
      - name: Nightly DB backup cron
        run: |
          ssh -i ~/.ssh/deploy.pem "$SERVER_USER@$SERVER_HOST" \
            "(crontab -l 2>/dev/null | grep -v backup-db.sh; echo '0 21 * * * bash \$HOME/paisa/backup-db.sh >> \$HOME/paisa/backups/cron.log 2>&1') | crontab -"
      - name: Smoke test public API (${{ env.API_URL }})
        run: bash scripts/smoke-test.sh "$API_URL"
      - name: Show server state on failure
        if: failure()
        run: ssh -i ~/.ssh/deploy.pem "$SERVER_USER@$SERVER_HOST" 'docker ps -a; docker logs --tail 80 paisa-api 2>&1 || true'

  # ── 4. Build the Android APK against the live API (parallel to image/deploy) ────────────────────
  apk:
    name: Build Android APK
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Install app dependencies
        working-directory: mobile
        run: npm ci
      - name: Build release APK
        working-directory: mobile/android
        env:
          EXPO_PUBLIC_API_URL: ${{ env.API_URL }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --console=plain \
            -PversionCode=${{ github.run_number }} -PversionName=0.1.${{ github.run_number }} \
            -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: Name the artifact
        run: cp mobile/android/app/build/outputs/apk/release/app-release.apk Paisa-build-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Paisa-apk-${{ github.run_number }}
          path: Paisa-build-${{ github.run_number }}.apk
          retention-days: 30
