services:
  api:
    image: ${IMAGE:?set IMAGE}
    container_name: paisa-api
    restart: unless-stopped
    environment:
      SMTP_USER: ${SMTP_USER:-}                    # Gmail sender for OTP emails (from ~/paisa/.env)
      SMTP_PASS: ${SMTP_PASS:-}                    # Gmail app password
      MAIL_FROM_NAME: Paisa
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}          # from ~/paisa/.env (written by CI); empty = admin dashboard disabled
    read_only: true                                # container filesystem is immutable; only /data and /backups are writable
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 200
    mem_limit: 512m
    ports:
      - "127.0.0.1:3000:3000"                      # host-local only (deploy health check); the public side is Caddy
    volumes:
      - /home/ec2-user/paisa/data:/data          # SQLite database lives on the host, survives redeploys
      - /home/ec2-user/paisa/backups:/backups

  caddy:
    image: caddy:2-alpine
    container_name: paisa-caddy
    restart: unless-stopped
    depends_on: [api]                               # api is recreated first, which frees port 80 for Caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /home/ec2-user/paisa/Caddyfile:/etc/caddy/Caddyfile:ro
      - /home/ec2-user/paisa/caddy-data:/data      # certificates: keep across redeploys (Let's Encrypt rate limits)
      - /home/ec2-user/paisa/caddy-config:/config
